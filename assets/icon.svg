<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="80" fill="url(#grad1)"/>

  <!-- Chart icon -->
  <!-- Bar chart bars -->
  <rect x="100" y="280" width="60" height="130" fill="white" opacity="0.9" rx="8"/>
  <rect x="180" y="220" width="60" height="190" fill="white" opacity="0.9" rx="8"/>
  <rect x="260" y="180" width="60" height="230" fill="white" opacity="0.9" rx="8"/>
  <rect x="340" y="240" width="60" height="170" fill="white" opacity="0.9" rx="8"/>

  <!-- Trend line overlay -->
  <path d="M 90 300 L 150 250 L 220 200 L 290 160 L 360 220 L 420 180"
        stroke="#38ef7d"
        stroke-width="12"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.9"/>

  <!-- Dots on line -->
  <circle cx="90" cy="300" r="10" fill="#38ef7d" opacity="0.9"/>
  <circle cx="150" cy="250" r="10" fill="#38ef7d" opacity="0.9"/>
  <circle cx="220" cy="200" r="10" fill="#38ef7d" opacity="0.9"/>
  <circle cx="290" cy="160" r="10" fill="#38ef7d" opacity="0.9"/>
  <circle cx="360" cy="220" r="10" fill="#38ef7d" opacity="0.9"/>
  <circle cx="420" cy="180" r="10" fill="#38ef7d" opacity="0.9"/>

  <!-- Dollar sign -->
  <text x="256" y="130" font-family="Arial, sans-serif" font-size="100" font-weight="bold"
        fill="white" text-anchor="middle" opacity="0.9">$</text>
</svg>
